<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | NaoBoKhoManh</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #818cf8;
            --primary-hover: #6366f1;
            --bg: #030712;
            --surface: rgba(17, 24, 39, 0.7);
            --border: rgba(255, 255, 255, 0.1);
            --text: #f9fafb;
            --text-muted: #9ca3af;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --glass: rgba(255, 255, 255, 0.03);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.15) 0px, transparent 50%);
            color: var(--text);
            min-height: 100vh;
            padding: 40px 20px;
            line-height: 1.5;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 13px;
            color: var(--success);
            font-weight: 500;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--success);
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 8px;
            background: var(--glass);
            padding: 6px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 24px;
            width: fit-content;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 10px 24px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            border-radius: 8px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tab-btn:hover {
            color: var(--text);
            background: rgba(255, 255, 255, 0.05);
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        /* Card & Table */
        .card {
            background: var(--surface);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .card-title {
            font-size: 20px;
            font-weight: 600;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        .btn-secondary {
            background: var(--glass);
            border-color: var(--border);
            color: var(--text);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border-color: rgba(239, 68, 68, 0.2);
        }

        .btn-danger:hover {
            background: var(--danger);
            color: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 16px;
            color: var(--text-muted);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
        }

        td {
            padding: 20px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            font-size: 15px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.01);
        }

        .tag {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .tag-success { background: rgba(16, 185, 129, 0.1); color: var(--success); }
        .tag-pending { background: rgba(245, 158, 11, 0.1); color: var(--warning); }
        .tag-danger { background: rgba(239, 68, 68, 0.1); color: var(--danger); }

        .price { font-weight: 600; color: #cbd5e1; }
        .quantity-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 28px;
            height: 28px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 700;
        }
        .qty-high { background: rgba(16, 185, 129, 0.1); color: var(--success); }
        .qty-low { background: rgba(239, 68, 68, 0.1); color: var(--danger); animation: pulse 2s infinite; }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .modal.show {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: #111827;
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 32px;
            width: 100%;
            max-width: 500px;
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .modal.show .modal-content {
            transform: scale(1);
        }

        .modal-header {
            margin-bottom: 24px;
        }

        .modal-title {
            font-size: 22px;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 16px;
            background: #030712;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: white;
            font-family: inherit;
            font-size: 15px;
            transition: all 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        /* Toast */
        .toast-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 2000;
        }

        .toast {
            background: #111827;
            border: 1px solid var(--border);
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideIn 0.3s forwards;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>NaoBoKhoManh Admin</h1>
            <div class="status-badge">
                <span class="status-dot"></span>
                Hệ thống: Sẵn sàng
            </div>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('products', event)">Sản phẩm</button>
            <button class="tab-btn" onclick="switchTab('customers', event)">Khách hàng</button>
            <button class="tab-btn" onclick="switchTab('orders', event)">Đơn hàng</button>
        </div>

        <div class="card">
            <div class="card-header">
                <h2 class="card-title" id="tabTitle">Quản lý Sản phẩm</h2>
                <div style="display: flex; gap: 8px;">
                    <button class="btn btn-secondary" id="syncBtn" style="display: none;" onclick="syncGSheet()">
                        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        Đồng bộ Sheets
                    </button>
                    <button class="btn btn-primary" onclick="showModal()">
                        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                        Thêm mới
                    </button>
                </div>
            </div>
            
            <div style="overflow-x: auto;">
                <table id="dataTable">
                    <thead id="tableHead"></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Form -->
    <div class="modal" id="formModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle">Thêm Sản phẩm</h3>
            </div>
            <form id="dataForm">
                <div id="formFields"></div>
                <div style="display: flex; gap: 12px; margin-top: 32px;">
                    <button type="submit" class="btn btn-primary" style="flex: 2">Lưu thông tin</button>
                    <button type="button" class="btn btn-secondary" onclick="hideModal()" style="flex: 1">Hủy</button>
                </div>
            </form>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="../config.js"></script>
    <script>
        let currentTab = 'products';
        let items = [];

        async function fetchData() {
            try {
                const res = await fetch(window.APP_CONFIG.API_BASE_URL + `/api/${currentTab}`);
                if (!res.ok) throw new Error(`HTTP Error ${res.status}`);
                items = await res.json();
                renderTable();
            } catch (err) { 
                console.error('Fetch error:', err);
                showToast('Lỗi khi tải dữ liệu! ' + err.message, 'danger');
            }
        }

        function switchTab(tab, e) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if (e && e.target) e.target.classList.add('active');
            
            const titles = {
                'products': 'Quản lý Sản phẩm',
                'customers': 'Danh sách Khách hàng',
                'orders': 'Lịch sử Đơn hàng'
            };
            document.getElementById('tabTitle').innerText = titles[tab];
            document.getElementById('syncBtn').style.display = tab === 'customers' ? 'inline-flex' : 'none';
            fetchData();
        }

        function renderTable() {
            const thead = document.getElementById('tableHead');
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            if (currentTab === 'products') {
                thead.innerHTML = `<tr><th>Tên sản phẩm</th><th>Đơn giá</th><th>Số lượng kho</th><th>Hành động</th></tr>`;
                items.forEach(item => {
                    tbody.innerHTML += `<tr>
                        <td style="font-weight: 500">${item.name}</td>
                        <td class="price">${item.price.toLocaleString()}đ</td>
                        <td>
                            <span class="quantity-badge ${item.quantity < 10 ? 'qty-low' : 'qty-high'}">${item.quantity}</span>
                        </td>
                        <td>
                            <div style="display: flex; gap: 8px">
                                <button class="btn btn-secondary" onclick="editItem(${item.id})">Sửa</button>
                                <button class="btn btn-danger" onclick="deleteItem(${item.id})">Xóa</button>
                            </div>
                        </td>
                    </tr>`;
                });
            } else if (currentTab === 'customers') {
                thead.innerHTML = `<tr><th>Khách hàng</th><th>SĐT</th><th>Email</th><th>Thông tin thêm</th><th>Hành động</th></tr>`;
                items.forEach(item => {
                        <td>
                            <div style="font-weight: 600">${item.name}</div>
                            <div style="font-size: 13px; color: var(--text-muted)">ID: #${item.id}</div>
                        </td>
                        <td>${item.phone}</td>
                        <td style="font-size: 14px; color: var(--text-muted)">${item.email || '-'}</td>
                        <td><div style="max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-muted)">${item.notes || '-'}</div></td>
                        <td>
                            <div style="display: flex; gap: 8px">
                                <button class="btn btn-secondary" onclick="editItem(${item.id})">Sửa</button>
                                <button class="btn btn-danger" onclick="deleteItem(${item.id})">Xóa</button>
                            </div>
                        </td>
                    </tr>`;
                });
            } else if (currentTab === 'orders') {
                thead.innerHTML = `<tr><th>ID</th><th>Khách hàng</th><th>Sản phẩm</th><th>Tổng tiền</th><th>Trạng thái</th><th>Hành động</th></tr>`;
                items.forEach(item => {
                    const statusText = (item.status || 'pending').toUpperCase();
                    const statusClass = (statusText === 'SUCCESS' || statusText === 'CONFIRMED') ? 'tag-success' : (statusText === 'PENDING' ? 'tag-pending' : 'tag-danger');
                    tbody.innerHTML += `<tr>
                        <td style="color: var(--text-muted)">#${item.id}</td>
                        <td style="font-weight: 600">${item.customer_name || 'Khách lạ'}</td>
                        <td>${item.product_name || 'SP đã xóa'}</td>
                        <td class="price">${(item.amount || 0).toLocaleString()}đ</td>
                        <td><span class="tag ${statusClass}">${statusText}</span></td>
                        <td>
                            <div style="display: flex; gap: 8px">
                                <button class="btn btn-secondary" onclick="editItem(${item.id})">Sửa</button>
                                <button class="btn btn-danger" onclick="deleteItem(${item.id})">Xóa</button>
                            </div>
                        </td>
                    </tr>`;
                });
            }
        }

        async function showModal(id = null) {
            const fields = document.getElementById('formFields');
            const modalTitle = document.getElementById('modalTitle');
            const form = document.getElementById('dataForm');
            const modal = document.getElementById('formModal');
            
            form.reset();
            form.dataset.id = id || '';
            const item = id ? items.find(i => i.id === id) : {};

            if (currentTab === 'products') {
                modalTitle.innerText = id ? 'Chỉnh sửa Sản phẩm' : 'Thêm Sản phẩm';
                fields.innerHTML = `
                    <div class="form-group"><label>Tên sản phẩm</label><input name="name" value="${item.name || ''}" required placeholder="Nhập tên sản phẩm..."></div>
                    <div class="form-group"><label>Đơn giá (VNĐ)</label><input type="number" name="price" value="${item.price || ''}" required></div>
                    <div class="form-group"><label>Số lượng kho</label><input type="number" name="quantity" value="${item.quantity || ''}" required></div>
                    <div class="form-group"><label>Mô tả ngắn</label><textarea name="description" rows="3">${item.description || ''}</textarea></div>
                `;
            } else if (currentTab === 'customers') {
                modalTitle.innerText = id ? 'Chỉnh sửa Khách hàng' : 'Thêm Khách hàng';
                fields.innerHTML = `
                    <div class="form-group"><label>Họ và tên</label><input name="name" value="${item.name || ''}" required></div>
                    <div class="form-group"><label>Số điện thoại</label><input name="phone" value="${item.phone || ''}" required></div>
                    <div class="form-group"><label>Zalo (Tùy chọn)</label><input name="zalo" value="${item.zalo || ''}"></div>
                    <div class="form-group"><label>Email</label><input type="email" name="email" value="${item.email || ''}"></div>
                    <div class="form-group"><label>Ghi chú khách hàng</label><textarea name="notes" rows="3">${item.notes || ''}</textarea></div>
                `;
            } else if (currentTab === 'orders') {
                modalTitle.innerText = id ? 'Cập nhật Đơn hàng' : 'Tạo Đơn hàng mới';
                
                if (id) {
                    // Edit mode - only status and notes
                    fields.innerHTML = `
                        <div class="form-group"><label>Trạng thái đơn hàng</label>
                            <select name="status">
                                <option value="pending" ${item.status === 'pending' ? 'selected' : ''}>Chờ xử lý</option>
                                <option value="confirmed" ${item.status === 'confirmed' ? 'selected' : ''}>Đã xác nhận</option>
                                <option value="cancelled" ${item.status === 'cancelled' ? 'selected' : ''}>Đã hủy</option>
                            </select>
                        </div>
                        <div class="form-group"><label>Ghi chú đơn hàng</label><textarea name="notes" rows="3">${item.notes || ''}</textarea></div>
                    `;
                } else {
                    // Create mode - need to fetch data
                    const [resC, resP] = await Promise.all([fetch(window.APP_CONFIG.API_BASE_URL + '/api/customers'), fetch(window.APP_CONFIG.API_BASE_URL + '/api/products')]);
                    const customers = await resC.json();
                    const products = await resP.json();
                    
                    fields.innerHTML = `
                        <div class="form-group"><label>Chọn Khách hàng</label>
                            <select name="customer_id" required>
                                <option value="">-- Chọn khách hàng --</option>
                                ${customers.map(c => `<option value="${c.id}">${c.name} (${c.phone})</option>`).join('')}
                            </select>
                        </div>
                        <div class="form-group"><label>Chọn Sản phẩm</label>
                            <select name="product_id" id="prodSelect" required onchange="updateOrderPrice(this)">
                                <option value="">-- Chọn sản phẩm --</option>
                                ${products.map(p => `<option value="${p.id}" data-price="${p.price}">[Kho: ${p.quantity}] ${p.name}</option>`).join('')}
                            </select>
                        </div>
                        <div class="form-group"><label>Tổng tiền thanh toán (VNĐ)</label><input type="number" id="orderAmount" name="amount" required></div>
                        <div class="form-group"><label>Ghi chú</label><textarea name="notes" rows="2"></textarea></div>
                        <div style="background: rgba(129, 140, 248, 0.1); padding: 12px; border-radius: 8px; font-size: 13px; color: var(--primary);">
                            ℹ️ Khi tạo đơn, hệ thống sẽ tự động trừ 1 vào số lượng kho.
                        </div>
                    `;
                }
            }
            
            modal.classList.add('show');
        }

        function updateOrderPrice(select) {
            const price = select.options[select.selectedIndex].dataset.price;
            if (price) document.getElementById('orderAmount').value = price;
        }

        function hideModal() {
            document.getElementById('formModal').classList.remove('show');
        }

        document.getElementById('dataForm').onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            if (e.target.dataset.id) data.id = e.target.dataset.id;

            try {
                const res = await fetch(window.APP_CONFIG.API_BASE_URL + `/api/${currentTab}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                let result;
                try { 
                    result = await res.json();
                } catch(e) {
                    throw new Error('Server không trả về JSON hợp lệ');
                }

                if (res.ok && result.success) {
                    showToast(e.target.dataset.id ? 'Đã cập nhật thành công!' : 'Đã thêm thành công!', 'success');
                    hideModal();
                    fetchData();
                } else {
                    const errorMsg = result.error || 'Thao tác thất bại!';
                    showToast('Lỗi: ' + errorMsg, 'danger');
                }
            } catch (err) {
                console.error('Save error:', err);
                showToast('Lỗi kết nối máy chủ! ' + err.message, 'danger');
            }
        };

        async function deleteItem(id) {
            if (!confirm('Bạn có chắc chắn muốn xóa mục này?')) return;
            try {
                const res = await fetch(window.APP_CONFIG.API_BASE_URL + '/api/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ table: currentTab, id: id })
                });
                const result = await res.json();
                if (res.ok && result.success) {
                    showToast('Đã xóa dữ liệu thành công.', 'success');
                    fetchData();
                } else {
                    showToast(result.error || 'Lỗi khi xóa dữ liệu!', 'danger');
                }
            } catch (err) {
                console.error('Delete error:', err);
                showToast('Lỗi kết nối! ' + err.message, 'danger');
            }
        }

        function editItem(id) { showModal(id); }

        function showToast(msg, type) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            const color = type === 'success' ? 'var(--success)' : 'var(--danger)';
            toast.innerHTML = `
                <div style="width: 4px; height: 24px; background: ${color}; border-radius: 2px"></div>
                <div style="flex: 1">${msg}</div>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        async function syncGSheet() {
            const btn = document.getElementById('syncBtn');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = 'Đang đồng bộ...';
            
            try {
                const res = await fetch(window.APP_CONFIG.API_BASE_URL + '/api/sync-gsheet');
                const result = await res.json();
                if (result.success) {
                    showToast(result.message, 'success');
                    fetchData();
                } else {
                    showToast(result.error || 'Đồng bộ thất bại!', 'danger');
                }
            } catch (err) {
                showToast('Lỗi kết nối máy chủ!', 'danger');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }

        // Initialize
        fetchData();
    </script>
</body>
</html>
